<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aaliya Collection — Admin Setup</title>
<style>
body{font-family:Arial,sans-serif;background:#f6f3f8;margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;box-sizing:border-box}
main{background:#fff;max-width:420px;width:100%;padding:26px;border-radius:16px;box-shadow:0 8px 30px #0001}
h2{margin-top:0;color:#6d235e}label{display:block;margin:14px 0 6px;font-weight:600}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccc;border-radius:8px;font-size:16px}
button{margin-top:20px;width:100%;padding:13px;border:0;border-radius:8px;background:#6d235e;color:white;font-size:16px;font-weight:bold}
#msg{margin-top:15px;overflow-wrap:anywhere}.note{font-size:13px;color:#555;line-height:1.5}
</style></head><body><main>
<h2>Admin Account Setup</h2><p class="note">One-time setup only. Keep your setup key private. Password must be at least 12 characters.</p>
<form id="f">
<label>ADMIN_SETUP_KEY</label><input id="key" type="password" required autocomplete="off">
<label>Admin Email</label><input id="email" type="email" required value="aliyajewellery9@gmail.com">
<label>New Admin Password</label><input id="pw" type="password" minlength="12" required autocomplete="new-password">
<button type="submit">Create Admin Account</button>
</form><div id="msg" role="status"></div>
<script>
document.getElementById('f').addEventListener('submit',async e=>{
e.preventDefault();const msg=document.getElementById('msg');msg.textContent='Creating account…';
try{const r=await fetch('/api/admin/setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({setupKey:document.getElementById('key').value,email:document.getElementById('email').value,password:document.getElementById('pw').value})});
const d=await r.json();if(r.ok){msg.textContent='Admin account created! Now open /admin.html and log in. Remove this setup page from GitHub afterward.';document.getElementById('f').reset()}else msg.textContent=d.error||'Setup failed';
}catch(err){msg.textContent='Connection error. Please check the website and try again.'}
});
</script></main></body></html>
