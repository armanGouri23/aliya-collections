
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aaliya Collection | Jewellery</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#fff8fc;color:#34242c}
header{background:#6d294f;color:white;padding:30px 15px;text-align:center}
header h1{margin:0;font-size:32px}
header p{margin:10px 0 0}
main{max-width:1100px;margin:auto;padding:20px}
h2{color:#6d294f;margin-top:30px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:18px}
.card{background:white;border:1px solid #eadbe5;border-radius:14px;padding:14px;box-shadow:0 3px 12px #00000008}
.card img{width:100%;height:190px;object-fit:cover;border-radius:10px}
.card h3{margin:12px 0}
.price{font-size:19px;font-weight:bold;color:#6d294f}
button{background:#6d294f;color:white;border:0;padding:12px 16px;border-radius:8px;cursor:pointer}
button:hover{background:#8a3968}
input,textarea{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px;font-size:16px}
textarea{min-height:100px}
.cart-item{padding:10px;background:white;border-bottom:1px solid #eee}
#msg{font-weight:bold;color:#24743c}
footer{background:#6d294f;color:white;text-align:center;padding:20px;margin-top:30px}
</style>
</head>
<body>

<header>
<h1>Aaliya Collection</h1>
<p>Jewellery for Every Moment ✨</p>
</header>

<main>
<h2>Our Collection</h2>
<p>Discover Oxidised, Handcrafted, Anti-Tarnish & Plated Jewellery.</p>

<div id="products" class="grid">Loading products...</div>

<h2>Your Cart</h2>
<div id="cart">Your cart is empty.</div>
<p id="total"><b>Total: ₹0</b></p>
<button onclick="clearCart()">Clear Cart</button>

<h2>Place Your Order</h2>
<form id="checkout">
<input name="customer" placeholder="Full Name" required>
<input name="phone" placeholder="Mobile Number" required>
<textarea name="address" placeholder="Delivery Address" required></textarea>
<button type="submit">Place Order (COD)</button>
</form>

<p id="msg"></p>
<p>Customer Care WhatsApp: 8302573760</p>
</main>

<footer>
© 2026 Aaliya Collection | All Rights Reserved
</footer>

<script>
let products=[];
let cart=[];

async function loadProducts(){
try{
const response=await fetch("/api/products");
products=await response.json();

const container=document.getElementById("products");

if(!products.length){
container.innerHTML="<p>Products will be added soon.</p>";
return;
}

container.innerHTML=products.map(p=>`
<div class="card">
${p.image?`<img src="${p.image}" alt="${p.name}">`:""}
<h3>${p.name}</h3>
<p>${p.category||"Jewellery"}</p>
<p class="price">₹${p.price}</p>
<button onclick="addToCart(${p.id})">Add to Cart</button>
</div>
`).join("");

}catch(error){
document.getElementById("products").innerHTML="Unable to load products.";
}
}

function addToCart(id){
const product=products.find(p=>p.id===id);
if(product){
cart.push({id:product.id,name:product.name,price:Number(product.price),qty:1});
showCart();
}
}

function showCart(){
const box=document.getElementById("cart");
const total=cart.reduce((sum,item)=>sum+item.price*item.qty,0);

if(!cart.length){
box.innerHTML="Your cart is empty.";
}else{
box.innerHTML=cart.map((item,index)=>`
<div class="cart-item">
${item.name} — ₹${item.price}
<button onclick="removeItem(${index})">Remove</button>
</div>
`).join("");
}

document.getElementById("total").innerHTML="<b>Total: ₹"+total+"</b>";
}

function removeItem(index){
cart.splice(index,1);
showCart();
}

function clearCart(){
cart=[];
showCart();
}

document.getElementById("checkout").addEventListener("submit",async function(e){
e.preventDefault();

if(!cart.length){
document.getElementById("msg").textContent="Please add products to cart first.";
return;
}

const form=new FormData(this);

const data={
customer:form.get("customer"),
phone:form.get("phone"),
address:form.get("address"),
items:cart.map(item=>({id:item.id,qty:item.qty}))
};

try{
const response=await fetch("/api/orders",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(data)
});

const result=await response.json();

if(result.success){
document.getElementById("msg").textContent=
"Order received! Order ID: "+result.orderId;

cart=[];
showCart();
this.reset();
}else{
document.getElementById("msg").textContent=
result.error||"Order failed.";
}
}catch(error){
document.getElementById("msg").textContent="Server error. Please try again.";
}
});

loadProducts();
showCart();
</script>

</body>
</html>
