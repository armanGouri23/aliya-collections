<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Aaliya Admin</title><link rel="stylesheet" href="/style.css"></head><body><main class="section"><a class="brand" href="/">AALIYA <small>ADMIN</small></a><section id="login"><h2>Admin login</h2><input id="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button class="btn" onclick="login()">Login</button><p id="msg"></p><h3>Forgot password</h3><input id="forgotemail" placeholder="Admin email"><button onclick="forgot()">Send OTP</button><input id="otp" placeholder="OTP"><input id="newpass" type="password" placeholder="New password (12+ chars)"><button onclick="resetpw()">Reset password</button></section><section id="dash" hidden><button onclick="logout()">Logout</button><h2>Add product</h2><div class="form"><input id="pname" placeholder="Product name"><input id="pcat" placeholder="Category (Oxidised etc)"><input id="pprice" type="number" placeholder="Price ₹"><input id="pimage" placeholder="Image URL"><input id="pstock" type="number" placeholder="Stock"><textarea id="pdesc" placeholder="Description"></textarea><button class="btn" onclick="addProduct()">Add product</button></div><h2>Products</h2><div id="plist"></div><h2>Orders</h2><div id="olist"></div><h2>Return requests</h2><div id="rlist"></div><h2>Change password</h2><input id="oldpw" type="password" placeholder="Old password"><input id="newpw" type="password" placeholder="New password 12+ chars"><button onclick="changePW()">Update</button><p id="msg2"></p></section></main><script>
const $=id=>document.getElementById(id);async function api(url,method='GET',body){let r=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined}),d=await r.json();if(!r.ok)throw Error(d.error||'Error');return d}
async function login(){try{await api('/api/admin/login','POST',{email:$('email').value,password:$('password').value});await load()}catch(e){$('msg').textContent=e.message}}
async function forgot(){try{await api('/api/admin/forgot','POST',{email:$('forgotemail').value});$('msg').textContent='Check email for OTP'}catch(e){$('msg').textContent=e.message}}
async function resetpw(){try{await api('/api/admin/reset-password','POST',{email:$('forgotemail').value,otp:$('otp').value,password:$('newpass').value});$('msg').textContent='Password reset. Login now.'}catch(e){$('msg').textContent=e.message}}
async function load(){try{await api('/api/admin/me');$('login').hidden=true;$('dash').hidden=false;let p=await api('/api/admin/products'),o=await api('/api/admin/orders'),r=await api('/api/admin/returns');$('plist').innerHTML=p.map(x=>`<p>${x.name} · ₹${x.price} · stock ${x.stock} <button onclick="del(${x.id})">Hide</button></p>`).join('');$('olist').innerHTML=o.map(x=>`<article class="product"><b>${x.order_code}</b> · ${x.name} · ₹${x.total}<p>${x.phone} | ${x.status}</p><select onchange="status(${x.id},this.value)">${['Pending','Confirmed','Packed','Shipped','Delivered','Cancelled'].map(s=>`<option ${s===x.status?'selected':''}>${s}</option>`).join('')}</select><p>${x.address}</p><small>${x.items}</small></article>`).join('');$('rlist').innerHTML=r.map(x=>`<p>${x.order_code} · ${x.phone} · ${x.reason} · ${x.status} <select onchange="retstatus(${x.id},this.value)">${['Requested','Approved','Rejected','Completed'].map(s=>`<option ${s===x.status?'selected':''}>${s}</option>`).join('')}</select></p>`).join('')}catch{}}
async function addProduct(){try{await api('/api/admin/products','POST',{name:$('pname').value,category:$('pcat').value,price:$('pprice').value,image:$('pimage').value,stock:$('pstock').value,description:$('pdesc').value});$('msg2').textContent='Added';load()}catch(e){$('msg2').textContent=e.message}}
async function del(id){await api('/api/admin/products/'+id,'DELETE');load()}async function status(id,s){await api('/api/admin/orders/'+id,'PATCH',{status:s});load()}async function retstatus(id,s){await api('/api/admin/returns/'+id,'PATCH',{status:s});load()}async function logout(){await api('/api/admin/logout','POST');location.reload()}async function changePW(){try{await api('/api/admin/change-password','POST',{oldPassword:$('oldpw').value,newPassword:$('newpw').value});$('msg2').textContent='Password updated'}catch(e){$('msg2').textContent=e.message}}load();
</script></body></html>
