
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aaliya Collection Admin</title>
<style>
body{font-family:Arial;background:#fff8fc;margin:0;color:#34242c}
header{background:#6d294f;color:white;padding:20px;text-align:center}
main{max-width:900px;margin:auto;padding:20px}
.box{background:white;border:1px solid #eadbe5;padding:18px;border-radius:12px;margin:18px 0}
input,textarea,select{width:100%;padding:12px;margin:8px 0;box-sizing:border-box;border:1px solid #ddd;border-radius:8px}
button{background:#6d294f;color:white;border:0;padding:12px 16px;border-radius:8px;margin:5px;cursor:pointer}
.item{background:#fff;padding:12px;border-bottom:1px solid #eee}
</style>
</head>
<body>
<header><h1>Aaliya Collection</h1><p>Admin Panel</p></header>
<main>

<div class="box" id="setup">
<h2>Create Admin Account</h2>
<input id="setupkey" placeholder="ADMIN_SETUP_KEY">
<input id="newuser" placeholder="Admin Username">
<input id="newpass" type="password" placeholder="Password (10+ characters)">
<button onclick="createAdmin()">Create Admin</button>
</div>

<div class="box" id="login">
<h2>Admin Login</h2>
<input id="username" placeholder="Username">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<p id="loginmsg"></p>
</div>

<div id="panel" style="display:none">

<div class="box">
<h2>Add Product</h2>
<input id="pname" placeholder="Product Name">
<input id="pcat" placeholder="Category">
<input id="pprice" type="number" placeholder="Price ₹">
<input id="pimage" placeholder="Image URL (optional)">
<textarea id="pdesc" placeholder="Description"></textarea>
<button onclick="addProduct()">Add Product</button>
</div>

<div class="box">
<h2>Products</h2>
<div id="products"></div>
</div>

<div class="box">
<h2>Customer Orders</h2>
<div id="orders"></div>
</div>

<button onclick="logout()">Logout</button>
</div>

<p id="msg"></p>
</main>

<script>
async function request(url,options={}){
const response=await fetch(url,{
...options,
headers:{
"Content-Type":"application/json",
...(options.headers||{})
}
});
const data=await response.json();
if(!response.ok)throw new Error(data.error||"Request failed");
return data;
}

async function createAdmin(){
try{
await request("/api/setup-admin",{
method:"POST",
body:JSON.stringify({
key:setupkey.value,
username:newuser.value,
password:newpass.value
})
});
loginmsg.textContent="Admin created. Please login.";
}catch(e){loginmsg.textContent=e.message}
}

async function login(){
try{
await request("/api/login",{
method:"POST",
body:JSON.stringify({
username:username.value,
password:password.value
})
});
loginbox();
}catch(e){loginmsg.textContent=e.message}
}

async function loginbox(){
setup.style.display="none";
login.style.display="none";
panel.style.display="block";
await loadProducts();
await loadOrders();
}

async function addProduct(){
try{
await request("/api/admin/products",{
method:"POST",
body:JSON.stringify({
name:pname.value,
category:pcat.value,
price:Number(pprice.value),
image:pimage.value,
description:pdesc.value
})
});
msg.textContent="Product added successfully!";
pname.value="";
pcat.value="";
pprice.value="";
pimage.value="";
pdesc.value="";
await loadProducts();
}catch(e){msg.textContent=e.message}
}

async function loadProducts(){
try{
const list=await request("/api/products");
products.innerHTML=list.map(p=>`
<div class="item">
<b>${p.name}</b> — ₹${p.price}
<button onclick="deleteProduct(${p.id})">Delete</button>
</div>
`).join("")||"No products";
}catch(e){products.textContent=e.message}
}

async function deleteProduct(id){
if(!confirm("Delete this product?"))return;
try{
await request("/api/admin/products/"+id,{method:"DELETE"});
await loadProducts();
}catch(e){msg.textContent=e.message}
}

async function loadOrders(){
try{
const list=await request("/api/admin/orders");
orders.innerHTML=list.map(o=>`
<div class="item">
<b>Order #${o.id}</b><br>
Customer: ${o.customer}<br>
Phone: ${o.phone}<br>
Address: ${o.address}<br>
Total: ₹${o.total}<br>
Status: ${o.status}<br>
<button onclick="updateOrder(${o.id})">Mark Delivered</button>
</div>
`).join("")||"No orders";
}catch(e){orders.textContent=e.message}
}

async function updateOrder(id){
try{
await request("/api/admin/orders/"+id,{
method:"PATCH",
body:JSON.stringify({status:"Delivered",payment:"Pending"})
});
await loadOrders();
}catch(e){msg.textContent=e.message}
}

async function logout(){
await request("/api/logout",{method:"POST"});
location.reload();
}
</script>
</body>
</html>
