<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aliya Collections | Jewellery</title><style>body{font:16px Arial;margin:0;color:#34242c;background:#fffafc}header{background:#6d294f;color:white;padding:24px;text-align:center}main{max-width:950px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}.card{background:white;border:1px solid #eadbe5;border-radius:12px;padding:12px}.card img{width:100%;height:160px;object-fit:cover;border-radius:8px}button{background:#6d294f;color:white;border:0;padding:10px 14px;border-radius:8px;cursor:pointer}input,textarea{padding:10px;width:95%;margin:6px 0;border:1px solid #ddd;border-radius:6px}</style><header><h1>Aliya Collections</h1><p>Jewellery for every moment ✨</p></header><main><h2>Our Collection</h2><p>Discover oxidised, handcrafted, anti-tarnish & plated jewellery.</p><div id="products" class="grid">Loading products…</div><h2>Your Cart</h2><div id="cart"></div><h2>Place an Order</h2><form id="checkout"><input name="customer" placeholder="Full name" required><input name="phone" placeholder="Mobile number" required><textarea name="address" placeholder="Delivery address" required></textarea><button>Submit order (COD)</button></form><p id="msg"></p><p>Customer care WhatsApp: 8302573760</p></main><script>let products=[],cart=[];async function load(){try{products=await(await fetch('/api/products')).json()}catch{}document.querySelector('#products').innerHTML=products.length?products.map(p=>`<div class="card">${p.image?`<img src="${p.image}" alt="">`:''}<h3>${p.name}</h3><p>₹${p.price}</p><button onclick="add(${p.id})">Add to cart</button></div>`).join(''):'Products will be added soon.'}function add(id){let p=products.find(x=>x.id===id);cart.push({id:p.id,name:p.name,price:p.price});show()}function show(){document.querySelector('#cart').innerHTML=cart.map(x=>x.name+' — ₹'+x.price).join('<br>')+'<br><b>Total ₹'+cart.reduce((a,x)=>a+x.price,0)+'</b>'}document.querySelector('#checkout').onsubmit=async e=>{e.preventDefault();if(!cart.length){document.querySelector('#msg').textContent='Please add products first';return}let f=new FormData(e.target),data=Object.fromEntries(f);data.items=cart;data.total=cart.reduce((a,x)=>a+x.price,0);let r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});let j=await r.json();document.querySelector('#msg').textContent=j.ok?'Order received! Order ID: '+j.id:(j.error||'Could not submit');if(j.ok){cart=[];show();e.target.reset()}};load();</script></html>
