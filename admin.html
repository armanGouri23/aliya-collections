<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aliya Collections Admin</title><body style="font:16px Arial;max-width:850px;margin:30px auto;padding:15px"><h1>Aliya Collections — Admin</h1><section id="login"><h2>Login</h2><input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password"><button onclick="login()">Login</button><p id="msg"></p></section><section id="panel" hidden><button onclick="logout()">Logout</button><h2>Add product</h2><input id="name" placeholder="Product name"><input id="cat" placeholder="Category"><input id="price" type="number" placeholder="Price"><input id="img" placeholder="Image URL (optional)"><button onclick="add()">Add product</button><h2>Orders</h2><div id="orders"></div></section><script>async function login(){let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})});if(r.ok){document.querySelector('#login').hidden=true;document.querySelector('#panel').hidden=false;load()}else msg.textContent='Login failed'}async function load(){let o=await(await fetch('/api/admin/orders')).json();orders.innerHTML=o.map(x=>`<article style="border:1px solid #ddd;padding:12px;margin:8px 0"><b>#${x.id} ${x.customer}</b> — ${x.phone}<p>${x.address}</p><p>${x.items} | ₹${x.total}</p><select id="s${x.id}"><option>New</option><option>Packed</option><option>Shipped</option><option>Delivered</option><option>Cancelled</option></select><select id="p${x.id}"><option>Pending</option><option>Paid</option></select><button onclick="upd(${x.id})">Save status</button></article>`).join('')||'No orders yet'}async function upd(id){await fetch('/api/admin/orders/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:document.querySelector('#s'+id).value,payment:document.querySelector('#p'+id).value})});alert('Updated')}async function add(){let r=await fetch('/api/admin/products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.value,category:cat.value,price:Number(price.value),image:img.value})});alert(r.ok?'Product added':'Could not add product')}async function logout(){await fetch('/api/logout',{method:'POST'});location.reload()}</script></body></html>
